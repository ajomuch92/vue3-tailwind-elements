name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` runs vue-tsc, the library build and both test files.
      - run: npm test

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The playground aliases the library to ../src and pulls nothing from the
      # root install, so it needs neither `npm ci` nor a library build here.
      - run: npm install
        working-directory: example
      # Renders the home page and all 37 component stories.
      - run: npm run check
        working-directory: example
      - run: npm run build
        working-directory: example

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The docs install the published package from npm, so they build
      # independently of this checkout.
      - run: npm install
        working-directory: docs
      - run: npm run build
        working-directory: docs
